
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed - ShopEase</title>
    <title>Order Confirmed - ShopEase</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">
            Shop<span>Ease</span>
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#products">Products</a>
            <a href="orders.html">Orders</a>
            <a href="cart.html">Cart 🛒</a>
        </nav>
    </header>

    <main class="success-page">
        <section class="success-card">

            <div class="success-icon">✓</div>

            <h1>Order Placed Successfully!</h1>

            <p class="success-message">
                Thank you for shopping with ShopEase.
            </p>

            <p id="success-order-id" class="success-order-id"></p>

            <h2>Order Summary</h2>

            <div id="success-items">
                Loading order details...
            </div>

            <div class="success-total">
                <span>Total Paid</span>
                <span id="success-total">₹0</span>
            </div>

            <p class="success-status">
                Order Status: <strong>Pending</strong>
            </p>

            <div class="success-actions">
                <a href="index.html#products" class="continue-shopping">
                    Continue Shopping
                </a>

                <a href="orders.html" class="view-orders">
                    View My Orders
                </a>
            </div>

        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
